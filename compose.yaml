
services:
  magicmirror:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: mmm-chores-alt-mm
    environment:
      TZ: UTC
      MM_SCENARIO: server
    ports:
      - "8081:8080"
    volumes:
      # Named volume holds the entire module dir, seeded from the image
      # (which has node_modules baked in). chores.db will live here too.
      - module_dir:/opt/magic_mirror/modules/MMM-Chores-Alt
      # Bind-mount runtime files over the named volume so host-side
      # `npm run build` is picked up without rebuilding the image.
      - ./MMM-Chores-Alt.js:/opt/magic_mirror/modules/MMM-Chores-Alt/MMM-Chores-Alt.js
      - ./MMM-Chores-Alt.js.map:/opt/magic_mirror/modules/MMM-Chores-Alt/MMM-Chores-Alt.js.map
      - ./node_helper.js:/opt/magic_mirror/modules/MMM-Chores-Alt/node_helper.js
      - ./node_helper.js.map:/opt/magic_mirror/modules/MMM-Chores-Alt/node_helper.js.map
      - ./MMM-Chores-Alt.css:/opt/magic_mirror/modules/MMM-Chores-Alt/MMM-Chores-Alt.css
      - ./package.json:/opt/magic_mirror/modules/MMM-Chores-Alt/package.json
      - ./docker/config:/opt/magic_mirror/config
    restart: unless-stopped

volumes:
  module_dir:
